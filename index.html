<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <title>碳足迹计算器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #e8f5e8 0%, #f0f8f0 100%);
            color: #2d5016;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #4caf50;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mode-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: linear-gradient(45deg, #81c784, #66bb6a);
            color: white;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .mode-btn.active {
            background: linear-gradient(45deg, #4caf50, #388e3c);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .panel {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border: 2px solid #a5d6a7;
            margin-top: 20px;
        }

        .panel.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2e7d32;
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #a5d6a7;
            border-radius: 10px;
            font-size: 16px;
            background: #f8fdf8;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #4caf50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
            background: white;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(45deg, #4caf50, #388e3c);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(45deg, #388e3c, #2e7d32);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-success {
            background: linear-gradient(45deg, #66bb6a, #4caf50);
            color: white;
        }

        .btn-success:hover {
            background: linear-gradient(45deg, #4caf50, #388e3c);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .result {
            margin-top: 25px;
            padding: 25px;
            border-radius: 15px;
            background: linear-gradient(135deg, #e8f5e8, #dcedc8);
            display: none;
            border: 2px solid #a5d6a7;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .result.show {
            display: block;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .tree-conversion {
            background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            border: 2px solid #81c784;
            text-align: center;
        }

        .tree-icon {
            font-size: 3em;
            margin: 10px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .material-list {
            margin-top: 25px;
        }

        .material-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border: 2px solid #a5d6a7;
            border-radius: 10px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #f1f8e9, #dcedc8);
            transition: all 0.3s ease;
        }

        .material-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .delete-btn {
            background: linear-gradient(45deg, #ef5350, #d32f2f);
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: linear-gradient(45deg, #d32f2f, #b71c1c);
            transform: scale(1.05);
        }

        .eco-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .leaf-icon {
            font-size: 2.5em;
            color: #4caf50;
            animation: rotate 4s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .carbon-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .visual-item {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            border: 2px solid #a5d6a7;
            min-width: 120px;
        }

        .visual-number {
            font-size: 2em;
            font-weight: bold;
            color: #2e7d32;
            display: block;
        }

        .visual-label {
            font-size: 0.9em;
            color: #558b2f;
            margin-top: 5px;
        }

        .eco-banner {
            background: linear-gradient(45deg, #66bb6a, #81c784, #a5d6a7);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #4caf50;
        }

        .eco-tips {
            background: linear-gradient(135deg, #e8f5e8, #f1f8e9);
            border: 2px solid #a5d6a7;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            color: #1b5e20;
        }

        .eco-tips h4 {
            margin-top: 0;
            color: #2e7d32;
            margin-bottom: 15px;
            text-align: center;
        }

        .eco-tips div {
            background: rgba(255, 255, 255, 0.6);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid #4caf50;
        }

        /* 登录模态框样式 */
        .login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .login-modal.active {
            display: flex;
        }

        .login-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 3px solid #4caf50;
        }

        .login-content h2 {
            color: #2e7d32;
            margin-bottom: 20px;
        }

        .login-btn {
            width: 100%;
            margin-top: 15px;
        }

        .logout-btn {
            background: linear-gradient(45deg, #ff9800, #f57c00);
            margin-top: 15px;
        }

        .logout-btn:hover {
            background: linear-gradient(45deg, #f57c00, #e65100);
        }

        .error-message {
            color: #d32f2f;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌱 碳足迹计算器</h1>
            <div class="mode-switch">
                <button id="userMode" class="mode-btn active">用户端</button>
                <button id="adminMode" class="mode-btn">管理员端</button>
            </div>
        </header>

        <!-- 用户端界面 -->
        <div id="userPanel" class="panel active">
            <h2>计算碳足迹</h2>
            <div class="form-group">
                <label for="materialSelect">选择材料：</label>
                <select id="materialSelect" class="form-control">
                    <option value="">请选择材料</option>
                </select>
            </div>
            <div class="form-group">
                <label for="weightInput">输入质量 (kg)：</label>
                <input type="number" id="weightInput" class="form-control" placeholder="请输入质量" step="0.01" min="0">
            </div>
            <button id="calculateBtn" class="btn btn-primary">计算碳足迹</button>
            <div id="result" class="result"></div>
        </div>

        <!-- 管理员端界面 -->
        <div id="adminPanel" class="panel">
            <h2>材料管理</h2>
            <div class="form-group">
                <label for="newMaterial">材料名称：</label>
                <input type="text" id="newMaterial" class="form-control" placeholder="请输入材料名称">
            </div>
            <div class="form-group">
                <label for="newCoefficient">碳足迹系数 (kg CO₂/kg)：</label>
                <input type="number" id="newCoefficient" class="form-control" placeholder="请输入碳足迹系数" step="0.001" min="0">
            </div>
            <button id="addMaterialBtn" class="btn btn-success">添加材料</button>
            
            <h3>材料列表</h3>
            <div id="materialList" class="material-list"></div>
            
            <button id="logoutBtn" class="btn logout-btn">退出登录</button>
        </div>
    </div>

    <!-- 登录模态框 -->
    <div id="loginModal" class="login-modal">
        <div class="login-content">
            <h2>管理员登录</h2>
            <div class="form-group">
                <label for="username">用户名：</label>
                <input type="text" id="username" class="form-control" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码：</label>
                <input type="password" id="password" class="form-control" placeholder="请输入密码">
            </div>
            <div id="loginError" class="error-message">用户名或密码错误！</div>
            <button id="loginBtn" class="btn btn-primary login-btn">登录</button>
            <button id="cancelLoginBtn" class="btn logout-btn login-btn">取消</button>
        </div>
    </div>

    <script>
        // 碳足迹计算器主类
        class CarbonFootprintCalculator {
            constructor() {
                this.materials = this.loadMaterials();
                this.isAdminLoggedIn = false;
                this.initializeEventListeners();
                this.updateMaterialSelect();
                this.updateMaterialList();
            }

            loadMaterials() {
                const saved = localStorage.getItem('carbonMaterials');
                return saved ? JSON.parse(saved) : {
                    '钢铁': 2.3,
					'铸铁': 2.56,
					'不锈钢': 2.20,
                    '铝': 11.0,
                    '铜': 5.79,
                    '水泥': 0.87,
                    'PVC塑料': 3.2,
					'PE塑料': 4.8,
					'合成橡胶': 2.4,
                    '木材': 0.5,
					
                };
            }

            saveMaterials() {
                localStorage.setItem('carbonMaterials', JSON.stringify(this.materials));
            }

            initializeEventListeners() {
                // 模式切换
                document.getElementById('userMode').addEventListener('click', () => this.switchMode('user'));
                document.getElementById('adminMode').addEventListener('click', () => this.switchMode('admin'));

                // 用户端功能
                document.getElementById('calculateBtn').addEventListener('click', () => this.calculateFootprint());

                // 管理员端功能
                document.getElementById('addMaterialBtn').addEventListener('click', () => this.addMaterial());
                document.getElementById('logoutBtn').addEventListener('click', () => this.logout());

                // 登录功能
                document.getElementById('loginBtn').addEventListener('click', () => this.login());
                document.getElementById('cancelLoginBtn').addEventListener('click', () => this.hideLoginModal());
                
                // 按回车键登录
                document.getElementById('password').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.login();
                    }
                });
            }

            showLoginModal() {
                document.getElementById('loginModal').classList.add('active');
                document.getElementById('username').focus();
            }

            hideLoginModal() {
                document.getElementById('loginModal').classList.remove('active');
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                document.getElementById('loginError').style.display = 'none';
            }

            login() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                if (username === 'PRTS' && password === '183906') {
                    this.isAdminLoggedIn = true;
                    this.hideLoginModal();
                    this.switchMode('admin', true);
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            }

            logout() {
                this.isAdminLoggedIn = false;
                this.switchMode('user');
            }

            switchMode(mode, fromLogin = false) {
                const userPanel = document.getElementById('userPanel');
                const adminPanel = document.getElementById('adminPanel');
                const userBtn = document.getElementById('userMode');
                const adminBtn = document.getElementById('adminMode');

                if (mode === 'user') {
                    userPanel.classList.add('active');
                    adminPanel.classList.remove('active');
                    userBtn.classList.add('active');
                    adminBtn.classList.remove('active');
                } else {
                    if (!this.isAdminLoggedIn && !fromLogin) {
                        this.showLoginModal();
                        return;
                    }
                    
                    userPanel.classList.remove('active');
                    adminPanel.classList.add('active');
                    userBtn.classList.remove('active');
                    adminBtn.classList.add('active');
                }
            }

            updateMaterialSelect() {
                const select = document.getElementById('materialSelect');
                select.innerHTML = '<option value="">请选择材料</option>';
                
                for (const material in this.materials) {
                    const option = document.createElement('option');
                    option.value = material;
                    option.textContent = `${material} (${this.materials[material]} kg CO₂/kg)`;
                    select.appendChild(option);
                }
            }

            calculateFootprint() {
                const material = document.getElementById('materialSelect').value;
                const weight = parseFloat(document.getElementById('weightInput').value);
                const resultDiv = document.getElementById('result');

                if (!material) {
                    alert('🌱 请选择材料');
                    return;
                }

                if (!weight || weight <= 0) {
                    alert('⚖️ 请输入有效的质量');
                    return;
                }

                const coefficient = this.materials[material];
                const footprint = (weight * coefficient).toFixed(2);
                
                // 树木换算：1棵树每年约吸收21.77kg CO₂
                const treesNeeded = (footprint / 21.77).toFixed(1);
                const treeIcons = this.generateTreeIcons(Math.min(Math.ceil(treesNeeded / 5), 20));

                resultDiv.innerHTML = `
                    <div style="text-align: center; margin-bottom: 20px;">
                        <h3>🌍 碳足迹计算结果</h3>
                        <div style="font-size: 3em; margin: 10px 0;">🌳</div>
                    </div>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div class="visual-item">
                            <span class="visual-number">${footprint}</span>
                            <div class="visual-label">kg CO₂</div>
                        </div>
                        <div class="visual-item">
                            <span class="visual-number">${treesNeeded}</span>
                            <div class="visual-label">棵树/年</div>
                        </div>
                    </div>
                    
                    <div class="tree-conversion">
                        <h4>🌲 环保建议</h4>
                        <p><strong>需要种植 ${treesNeeded} 棵树来抵消这部分碳排放</strong></p>
                        <div style="font-size: 2em; margin: 10px 0;">
                            ${treeIcons}
                        </div>
                        <p style="font-size: 0.9em; color: #2e7d32;">
                            💡 提示：1棵树每年大约可以吸收21.77kg CO₂
                        </p>
                    </div>
                    
                    <div style="margin-top: 20px; padding: 15px; background: rgba(255, 255, 255, 0.8); border-radius: 10px;">
                        <p><strong>🌿 材料：</strong>${material}</p>
                        <p><strong>⚖️ 质量：</strong>${weight} kg</p>
                        <p><strong>📊 碳足迹系数：</strong>${coefficient} kg CO₂/kg</p>
                    </div>
                `;
                resultDiv.classList.add('show');
            }

            // 生成树木图标
            generateTreeIcons(count) {
                const maxDisplay = 10;
                const displayCount = Math.min(count, maxDisplay);
                let icons = '';
                for (let i = 0; i < displayCount; i++) {
                    icons += '🌳';
                }
                if (count > maxDisplay) {
                    icons += ` <span style="font-size: 0.8em;">+${count - maxDisplay}棵</span>`;
                }
                return icons;
            }

            addMaterial() {
                if (!this.isAdminLoggedIn) {
                    this.showLoginModal();
                    return;
                }

                const name = document.getElementById('newMaterial').value.trim();
                const coefficient = parseFloat(document.getElementById('newCoefficient').value);

                if (!name) {
                    alert('🌱 请输入材料名称');
                    return;
                }

                if (!coefficient || coefficient <= 0) {
                    alert('📊 请输入有效的碳足迹系数');
                    return;
                }

                if (this.materials[name]) {
                    alert('🌿 该材料已存在');
                    return;
                }

                this.materials[name] = coefficient;
                this.saveMaterials();
                this.updateMaterialSelect();
                this.updateMaterialList();

                document.getElementById('newMaterial').value = '';
                document.getElementById('newCoefficient').value = '';

                alert('🌳 材料添加成功');
            }

            deleteMaterial(name) {
                if (!this.isAdminLoggedIn) {
                    this.showLoginModal();
                    return;
                }

                if (confirm(`确定要删除材料 "${name}" 吗？`)) {
                    delete this.materials[name];
                    this.saveMaterials();
                    this.updateMaterialSelect();
                    this.updateMaterialList();
                }
            }

            updateMaterialList() {
                const listDiv = document.getElementById('materialList');
                listDiv.innerHTML = '';

                for (const material in this.materials) {
                    const item = document.createElement('div');
                    item.className = 'material-item';
                    item.innerHTML = `
                        <span>${material}: ${this.materials[material]} kg CO₂/kg</span>
                        <button class="delete-btn" onclick="calculator.deleteMaterial('${material}')">删除</button>
                    `;
                    listDiv.appendChild(item);
                }
            }
        }

        // 初始化
        let calculator;
        document.addEventListener('DOMContentLoaded', () => {
            calculator = new CarbonFootprintCalculator();
        });
    </script>
	
	</div> 
    <!-- 关于我们部分 -->
    <footer class="eco-banner" style="margin-top: 40px; border-radius: 0;">
        <div style="max-width: 800px; margin: 0 auto;">
            <div style="font-size: 2em; margin-bottom: 10px;">🌱</div>
            <h3 style="margin-bottom: 15px;">关于我们</h3>
            <p style="margin-bottom: 10px;">
                此网页仅供郑州大学2025级水利与交通学院在读生人工智能大作业使用
            </p>
            <p style="margin-bottom: 10px;">
                数据源于[China Products Carbon Footprint Factors Database 2010-2022] 仅供参考 
            </p>
            <div style="
                margin-top: 15px;
                padding-top: 15px;
                border-top: 1px solid rgba(255,255,255,0.3);
                font-size: 12px;
            ">
                🌍 保护环境 从你我做起 🌍
            </div>
        </div>
    </footer>

</body>
</html>
</body>
</html>
